name: Application verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: neuron-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: pnpm
      - name: Install from reviewed lockfile
        run: pnpm install --frozen-lockfile
      - name: Install test browser and Linux dependencies
        run: pnpm --filter @neuron/web exec playwright install --with-deps chromium
      - name: Verify app, relay and production browser flows
        run: pnpm release:check --browser
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: neuron-browser-failures
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
