name: Manually deploy reviewed web release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neuron-production-web
  cancel-in-progress: false
jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @neuron/web exec playwright install --with-deps chromium
      - run: pnpm release:check --browser
      - name: Require operator-managed deployment secrets
        run: test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
      - name: Deploy static web app only
        run: pnpm dlx vercel@65.14.0 deploy --prod --yes --token="$VERCEL_TOKEN"
