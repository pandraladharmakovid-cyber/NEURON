<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" width="1280" height="430" role="img" aria-label="NEURON data pipeline: images stay in the browser, MobileNet v2 embeds them locally, a softmax head is trained, models are versioned in IndexedDB, and sharing is optional and encrypted.">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#080d19"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39caff"/><stop offset="1" stop-color="#57d7ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d5bff"/><stop offset="1" stop-color="#b387ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fbf94"/><stop offset="1" stop-color="#4cdbad"/>
    </linearGradient>
    <linearGradient id="flowline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39caff"/><stop offset="0.5" stop-color="#9668ff"/><stop offset="1" stop-color="#4cdbad"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .flow{stroke-dasharray:9 13;animation:flow 2.4s linear infinite}
      .card{animation:breathe 5s ease-in-out infinite}
      .c2{animation-delay:.5s}.c3{animation-delay:1s}.c4{animation-delay:1.5s}.c5{animation-delay:2s}
      .rise{animation:rise .9s ease-out both}
      .r1{animation-delay:.05s}.r2{animation-delay:.18s}.r3{animation-delay:.31s}.r4{animation-delay:.44s}.r5{animation-delay:.57s}
      @keyframes flow{to{stroke-dashoffset:-88}}
      @keyframes breathe{0%,100%{opacity:.92}50%{opacity:1}}
      @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
      @media (prefers-reduced-motion: reduce){.flow,.card,.rise{animation:none}}
    </style>
  </defs>

  <rect width="1280" height="430" fill="url(#pbg)"/>
  <g stroke="#141d2e" stroke-width="1">
    <path d="M0 60H1280M0 140H1280M0 220H1280M0 300H1280M0 380H1280"/>
  </g>

  <text x="40" y="42" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3.4" fill="#6f86a8">HOW NEURON WORKS · NOTHING IS UPLOADED UNLESS YOU EXPLICITLY SHARE A MODEL</text>

  <!-- connectors -->
  <g fill="none" stroke="url(#flowline)" stroke-width="3" filter="url(#soft)" opacity="0.9">
    <path class="flow" d="M236 196 H292"/>
    <path class="flow" d="M482 196 H538"/>
    <path class="flow" d="M758 196 H814"/>
    <path class="flow" d="M1034 196 H1088"/>
  </g>
  <g fill="#8fb6e8" opacity="0.75">
    <path d="M288 191l9 5-9 5z"/><path d="M534 191l9 5-9 5z"/><path d="M810 191l9 5-9 5z"/><path d="M1084 191l9 5-9 5z"/>
  </g>

  <!-- card 1 -->
  <g class="rise r1">
    <rect x="40" y="96" width="196" height="200" rx="16" fill="#0f1626" stroke="#243350"/>
    <rect x="40" y="96" width="196" height="4" rx="2" fill="url(#cyan)"/>
    <g transform="translate(60 118)" stroke="#39caff" stroke-width="2" fill="none" stroke-linejoin="round">
      <rect x="0" y="4" width="34" height="26" rx="5"/><circle cx="11" cy="13" r="3"/><path d="M0 25l10-9 8 7 7-6 9 8"/>
    </g>
    <text x="60" y="168" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="16.5" font-weight="800" fill="#edf1fc">1 · Images</text>
    <text x="60" y="192" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#92a2bc">JPEG / PNG / WebP</text>
    <text x="60" y="210" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#92a2bc">normalized to ≤768px</text>
    <rect x="60" y="228" width="156" height="24" rx="7" fill="#0b1524" stroke="#1d3c52"/>
    <text x="70" y="244" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#57c8ee">STAYS ON DEVICE</text>
  </g>

  <!-- card 2 -->
  <g class="rise r2">
    <rect x="296" y="96" width="188" height="200" rx="16" fill="#0f1626" stroke="#243350"/>
    <rect x="296" y="96" width="188" height="4" rx="2" fill="url(#violet)"/>
    <g transform="translate(316 118)" stroke="#a98bff" stroke-width="2" fill="none" stroke-linecap="round">
      <circle cx="8" cy="8" r="4"/><circle cx="26" cy="4" r="3"/><circle cx="26" cy="20" r="3"/><circle cx="9" cy="26" r="3"/>
      <path d="M12 8l11-3M12 10l10 8M11 24l12-3"/>
    </g>
    <text x="316" y="168" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="16.5" font-weight="800" fill="#edf1fc">2 · Encoder</text>
    <text x="316" y="192" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#92a2bc">MobileNet v2 (frozen)</text>
    <text x="316" y="210" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#92a2bc">1,280 features / image</text>
    <rect x="316" y="228" width="148" height="24" rx="7" fill="#0b1524" stroke="#3a2f63"/>
    <text x="326" y="244" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#b6a1ff">WEBGL → CPU</text>
  </g>

  <!-- card 3 -->
  <g class="rise r3">
    <rect x="542" y="96" width="216" height="200" rx="16" fill="#0f1626" stroke="#243350"/>
    <rect x="542" y="96" width="216" height="4" rx="2" fill="url(#cyan)"/>
    <g transform="translate(562 118)" stroke="#39caff" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M2 22h5v-6H2zM11 22h5V9h-5zM20 22h5V4h-5z"/><path d="M2 30h28"/>
    </g>
    <text x="562" y="168" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="16.5" font-weight="800" fill="#edf1fc">3 · Train</text>
    <text x="562" y="192" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#92a2bc">softmax head + real loss</text>
    <text x="562" y="210" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#92a2bc">seeded 20% validation</text>
    <rect x="562" y="228" width="176" height="24" rx="7" fill="#0b1524" stroke="#1d3c52"/>
    <text x="572" y="244" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#57c8ee">CANCELLABLE JOB</text>
  </g>

  <!-- card 4 -->
  <g class="rise r4">
    <rect x="818" y="96" width="216" height="200" rx="16" fill="#0f1626" stroke="#243350"/>
    <rect x="818" y="96" width="216" height="4" rx="2" fill="url(#violet)"/>
    <g transform="translate(838 118)" stroke="#a98bff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="16" cy="8" rx="14" ry="6"/><path d="M2 8v10c0 3.3 6.3 6 14 6s14-2.7 14-6V8"/><path d="M2 18v10c0 3.3 6.3 6 14 6s14-2.7 14-6V18"/>
    </g>
    <text x="838" y="168" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="16.5" font-weight="800" fill="#edf1fc">4 · Version</text>
    <text x="838" y="192" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#92a2bc">IndexedDB, immutable</text>
    <text x="838" y="210" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#92a2bc">activate · roll back</text>
    <rect x="838" y="228" width="176" height="24" rx="7" fill="#0b1524" stroke="#3a2f63"/>
    <text x="848" y="244" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#b6a1ff">.neuron.json</text>
  </g>

  <!-- card 5 -->
  <g class="rise r5">
    <rect x="1092" y="96" width="150" height="200" rx="16" fill="#0f1626" stroke="#2a4a3f"/>
    <rect x="1092" y="96" width="148" height="4" rx="2" fill="url(#green)"/>
    <g transform="translate(1112 118)" stroke="#4cdbad" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="12" width="28" height="18" rx="4"/><path d="M9 12V8a7 7 0 0114 0v4"/><circle cx="16" cy="21" r="2.4"/>
    </g>
    <text x="1112" y="168" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="16.5" font-weight="800" fill="#edf1fc">5 · Share</text>
    <text x="1112" y="192" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#92a2bc">AES-256-GCM</text>
    <text x="1112" y="210" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#92a2bc">expiring links</text>
    <rect x="1112" y="228" width="108" height="24" rx="7" fill="#0b1524" stroke="#20463a"/>
    <text x="1122" y="244" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#6fe0bb">KEY IN URL</text>
  </g>

  <!-- browser boundary -->
  <rect x="24" y="76" width="1034" height="248" rx="22" fill="none" stroke="#2b3f60" stroke-width="1.6" stroke-dasharray="6 8"/>
  <g transform="translate(40 66)">
    <rect x="0" y="-14" width="286" height="28" rx="9" fill="#0a1120" stroke="#2b3f60"/>
    <circle cx="16" cy="0" r="3.6" fill="#4cdbad"/>
    <text x="28" y="4.4" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" fill="#9fb3d1">YOUR BROWSER · YOUR DEVICE</text>
  </g>
  <g transform="translate(1092 372)">
    <rect x="-560" y="-16" width="576" height="28" rx="9" fill="#0a1120" stroke="#2b3f60"/>
    <text x="-548" y="3" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#8fb6e8">OPTIONAL RELAY (Cloudflare Worker + R2 + DO) · CIPHERTEXT ONLY</text>
  </g>

  <!-- footnote -->
  <g font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#6f86a8">
    <text x="40" y="404">◆ Uploads resize + store images locally · ◆ No account, no analytics, no sample uploads · ◆ Validation accuracy is not an independent test score</text>
  </g>
</svg>
