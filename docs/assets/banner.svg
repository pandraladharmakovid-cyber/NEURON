<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="NEURON — Your AI. Your device. Local-first machine learning in the browser.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b15"/>
      <stop offset="0.55" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#0d0a20"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39caff"/>
      <stop offset="1" stop-color="#a26bff"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#dbe7ff"/>
      <stop offset="1" stop-color="#b6a4ff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39caff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#39caff"/>
      <stop offset="0.7" stop-color="#9668ff"/>
      <stop offset="1" stop-color="#9668ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#39caff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#39caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9668ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#9668ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0v34" fill="none" stroke="#233047" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="360" rx="22"/>
    </clipPath>
    <style>
      .node{animation:pulse 3.2s ease-in-out infinite}
      .dash{stroke-dasharray:7 12;animation:flow 2.8s linear infinite}
      .glowA{animation:driftA 16s ease-in-out infinite alternate}
      .glowB{animation:driftB 20s ease-in-out infinite alternate}
      .fade{animation:rise 1s cubic-bezier(.2,.7,.3,1) both}
      .d1{animation-delay:.10s}.d2{animation-delay:.24s}.d3{animation-delay:.38s}
      .d4{animation-delay:.52s}.d5{animation-delay:.66s}.d6{animation-delay:.80s}
      .scan{animation:scan 6s linear infinite}
      @keyframes pulse{0%,100%{opacity:.45;r:3.2}50%{opacity:1;r:4.6}}
      @keyframes flow{to{stroke-dashoffset:-76}}
      @keyframes driftA{from{transform:translate(-30px,10px)}to{transform:translate(60px,-40px)}}
      @keyframes driftB{from{transform:translate(40px,-20px)}to{transform:translate(-50px,30px)}}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      @keyframes scan{0%{transform:translateX(-260px)}100%{transform:translateX(1280px)}}
      @media (prefers-reduced-motion: reduce){
        .node,.dash,.glowA,.glowB,.fade,.scan{animation:none}
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#grid)" opacity="0.5"/>
    <g class="glowA"><circle cx="150" cy="70" r="330" fill="url(#glowA)"/></g>
    <g class="glowB"><circle cx="1140" cy="320" r="380" fill="url(#glowB)"/></g>

    <!-- neural constellation -->
    <g stroke="#39caff" stroke-opacity="0.5" stroke-width="1.1" fill="none">
      <path class="dash" d="M690 96 L790 62 L884 118 L960 74 L1040 128"/>
      <path class="dash" d="M700 160 L806 132 L904 186 L990 140" stroke="#9668ff"/>
      <path class="dash" d="M672 232 L762 208 L856 246 L946 200 L1032 244" stroke-opacity="0.32"/>
      <path d="M790 62 L806 132 M884 118 L904 186 M960 74 L990 140 M762 208 L806 132 M856 246 L904 186" stroke-opacity="0.22"/>
    </g>
    <g fill="#8be0ff">
      <circle class="node" cx="690" cy="96" r="4"/><circle class="node" cx="790" cy="62" r="4" style="animation-delay:.2s"/>
      <circle class="node" cx="884" cy="118" r="4" style="animation-delay:.4s"/><circle class="node" cx="960" cy="74" r="4" style="animation-delay:.6s"/>
      <circle class="node" cx="1040" cy="128" r="4" style="animation-delay:.8s"/>
      <circle class="node" cx="700" cy="160" r="4" fill="#c3a6ff" style="animation-delay:.3s"/>
      <circle class="node" cx="806" cy="132" r="4" fill="#c3a6ff" style="animation-delay:.5s"/>
      <circle class="node" cx="904" cy="186" r="4" fill="#c3a6ff" style="animation-delay:.7s"/>
      <circle class="node" cx="990" cy="140" r="4" fill="#c3a6ff" style="animation-delay:.9s"/>
      <circle class="node" cx="672" cy="232" r="3.6" style="animation-delay:1.1s"/><circle class="node" cx="762" cy="208" r="3.6" style="animation-delay:1.3s"/>
      <circle class="node" cx="856" cy="246" r="3.6" style="animation-delay:1.5s"/><circle class="node" cx="946" cy="200" r="3.6" style="animation-delay:1.7s"/>
      <circle class="node" cx="1032" cy="244" r="3.6" style="animation-delay:1.9s"/>
    </g>
    <rect class="scan" x="0" y="0" width="200" height="360" fill="#39caff" opacity="0.05"/>

    <!-- logo mark -->
    <g class="fade d1" transform="translate(72 74)">
      <rect x="0" y="0" width="86" height="86" rx="24" fill="#0c1424" stroke="#233047"/>
      <g transform="translate(9 9) scale(0.53)" stroke="url(#mark)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M40 92V36l48 56V36M24 64h16m48 0h16"/>
        <circle cx="40" cy="28" r="6"/><circle cx="88" cy="100" r="6"/>
      </g>
    </g>

    <!-- wordmark -->
    <g class="fade d2">
      <text x="178" y="122" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="9" fill="url(#word)">NEURON</text>
      <text x="181" y="150" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" letter-spacing="5.4" fill="#7f93b4">YOUR AI. YOUR DEVICE.</text>
    </g>

    <!-- headline -->
    <g class="fade d3">
      <text x="72" y="222" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="700" fill="#edf1fc">Build useful models with your own data.</text>
      <text x="72" y="258" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="700" fill="#39caff">Private by design. Trained in your browser.</text>
    </g>

    <g class="fade d4" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1.6">
      <g fill="#9fb3d1">
        <rect x="72" y="284" width="150" height="30" rx="9" fill="#101a2c" stroke="#233047"/>
        <text x="90" y="303">LOCAL-FIRST</text>
        <rect x="232" y="284" width="156" height="30" rx="9" fill="#101a2c" stroke="#233047"/>
        <text x="250" y="303">REAL TRAINING</text>
        <rect x="398" y="284" width="170" height="30" rx="9" fill="#101a2c" stroke="#233047"/>
        <text x="416" y="303">OFFLINE SHELL</text>
        <rect x="578" y="284" width="400" height="30" rx="9" fill="#0e1b2a" stroke="#1d5c74"/>
        <circle cx="597" cy="299" r="3.4" fill="#4cdbad"/>
        <text x="609" y="303" fill="#9be7cf">IMAGE · CSV · TEXT · AUDIO · VIDEO · CUSTOM</text>
      </g>
    </g>

    <rect x="0" y="0" width="1280" height="360" rx="22" fill="none" stroke="#233047" stroke-width="1.4"/>
    <rect x="72" y="328" width="1136" height="2" rx="1" fill="url(#rule)" opacity="0.85"/>
  </g>
</svg>
