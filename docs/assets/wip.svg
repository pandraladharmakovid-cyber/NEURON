<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 118" width="1280" height="118" role="img" aria-label="Project under active development: image classification works today, other modules are planned.">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b1305"/>
      <stop offset="0.5" stop-color="#241a07"/>
      <stop offset="1" stop-color="#1b1305"/>
    </linearGradient>
    <pattern id="tape" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="26" height="26" fill="none"/>
      <rect width="12" height="26" fill="#f5b544" opacity="0.16"/>
    </pattern>
    <style>
      .tape{animation:tape 1.6s linear infinite}
      .blink{animation:blink 1.8s ease-in-out infinite}
      .txt{animation:rise .8s ease-out both}
      @keyframes tape{to{transform:translateX(26px)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
      @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
      @media (prefers-reduced-motion: reduce){.tape,.blink,.txt{animation:none}}
    </style>
    <clipPath id="wclip"><rect width="1280" height="118" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#wclip)">
    <rect width="1280" height="118" fill="url(#wbg)"/>
    <g class="tape"><rect x="-52" y="0" width="1400" height="118" fill="url(#tape)"/></g>
    <rect width="1280" height="1.5" fill="#f5b544" opacity="0.55"/>
    <rect y="116.5" width="1280" height="1.5" fill="#f5b544" opacity="0.35"/>
    <g class="txt">
      <g transform="translate(38 34)">
        <path d="M25 2 L48 44 H2 Z" fill="#f5b544" opacity="0.18" stroke="#f5b544" stroke-width="2.4" stroke-linejoin="round"/>
        <rect x="23.2" y="15" width="3.6" height="14" rx="1.8" fill="#f5b544"/>
        <circle class="blink" cx="25" cy="35" r="2.2" fill="#f5b544"/>
      </g>
      <text x="104" y="50" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="800" letter-spacing="1.2" fill="#ffd693">PROJECT UNDER ACTIVE DEVELOPMENT</text>
      <text x="104" y="80" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="13.6" fill="#d8c7a4">Image classification, offline packs, backups and encrypted sharing run today. Text, audio, video and tabular modalities are <tspan font-weight="700" fill="#ffcd7d">not built yet</tspan>.</text>
      <g transform="translate(1086 30)">
        <rect width="136" height="58" rx="12" fill="#0f1524" stroke="#4b3a16"/>
        <text x="68" y="24" text-anchor="middle" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="1.8" fill="#9fb3d1">SHIPPED</text>
        <text x="68" y="45" text-anchor="middle" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="800" fill="#f5b544">3 / 6 PHASES</text>
      </g>
    </g>
  </g>
</svg>
